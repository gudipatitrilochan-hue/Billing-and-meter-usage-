<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="MeterLedger: usage-based billing and metering service">
  <defs>
    <linearGradient id="bn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0f0e"/><stop offset="1" stop-color="#040504"/>
    </linearGradient>
    <radialGradient id="bn-spot" cx="0.82" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#22c55e" stop-opacity=".28"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="bn-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity=".07"/>
    </pattern>
    <linearGradient id="bn-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c55e" stop-opacity=".45"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bn-tier" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" rx="28" fill="url(#bn-bg)"/>
  <rect width="1280" height="400" rx="28" fill="url(#bn-dots)"/>
  <rect width="1280" height="400" rx="28" fill="url(#bn-spot)"/>

  <!-- lockup -->
  <g transform="translate(72 74) scale(1.25)">
  <defs>
    <linearGradient id="ml-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c1f"/><stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="ml-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <radialGradient id="ml-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#86efac" stop-opacity=".55"/><stop offset="1" stop-color="#86efac" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#ml-bg)"/>
  <rect x=".5" y=".5" width="63" height="63" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  <!-- graduated tiers -->
  <rect x="15" y="34" width="8" height="12" rx="3" fill="url(#ml-bar)" opacity=".55"/>
  <rect x="28" y="26" width="8" height="20" rx="3" fill="url(#ml-bar)" opacity=".8"/>
  <rect x="41" y="17" width="8" height="29" rx="3" fill="url(#ml-bar)"/>
  <!-- usage line + live reading -->
  <path d="M13 31 L27 22.5 L36 25 L47 12.5" fill="none" stroke="#f0fdf4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="47" cy="12.5" r="7" fill="url(#ml-glow)"/>
  <circle cx="47" cy="12.5" r="2.8" fill="#f0fdf4"/>
  <!-- ledger lines -->
  <path d="M13 51 H51" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M13 55.5 H37" stroke="#ffffff" stroke-opacity=".22" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <text x="170" y="122" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" letter-spacing="-1.5" fill="#fafafa"><tspan font-weight="500">Meter</tspan><tspan font-weight="800">Ledger</tspan></text>
  <text x="72" y="214" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-1.2" fill="#fafafa">Meter every event.</text>
  <text x="72" y="262" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-1.2" fill="#22c55e">Bill it exactly once.</text>
  <text x="72" y="304" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#a1a1aa">Idempotent ingestion · graduated tiers · locked, numbered invoices</text>
  <g font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#d4d4d8">
    <rect x="72" y="330" width="96" height="30" rx="15" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".1"/><text x="120" y="350" text-anchor="middle">FastAPI</text>
    <rect x="178" y="330" width="86" height="30" rx="15" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".1"/><text x="221" y="350" text-anchor="middle">SQLite</text>
    <rect x="274" y="330" width="116" height="30" rx="15" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".1"/><text x="332" y="350" text-anchor="middle">Bootstrap 5</text>
    <rect x="400" y="330" width="72" height="30" rx="15" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".1"/><text x="436" y="350" text-anchor="middle">GSAP</text>
    <rect x="482" y="330" width="100" height="30" rx="15" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".1"/><text x="532" y="350" text-anchor="middle">Chart.js</text>
  </g>

  <!-- invoice card -->
  <g transform="translate(780 44)">
    <rect width="428" height="312" rx="22" fill="#111312" stroke="#ffffff" stroke-opacity=".1"/>
    <g font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
      <text x="28" y="42" font-size="13" fill="#71717a">INV-202609-0001</text>
      <rect x="318" y="24" width="84" height="26" rx="13" fill="#22c55e" fill-opacity=".15"/>
      <circle cx="334" cy="37" r="4" fill="#22c55e"/><text x="344" y="42" font-size="12" fill="#86efac">PAID</text>
    </g>
    <text x="28" y="76" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#fafafa">ShopKart · Starter · Sep 2026</text>
    <!-- area chart -->
    <path d="M28 150 C 70 144, 92 130, 128 133 S 190 112, 222 117 S 286 94, 318 97 S 372 76, 400 72 L400 162 L28 162 Z" fill="url(#bn-area)"/>
    <path d="M28 150 C 70 144, 92 130, 128 133 S 190 112, 222 117 S 286 94, 318 97 S 372 76, 400 72" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="400" cy="72" r="5" fill="#f0fdf4"/>
    <!-- tier lines -->
    <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
      <rect x="28" y="180" width="6" height="14" rx="2" fill="url(#bn-tier)" opacity=".5"/><text x="44" y="192" fill="#a1a1aa">1 – 10,000 calls · free</text><text x="400" y="192" text-anchor="end" fill="#d4d4d8">₹0.00</text>
      <rect x="28" y="202" width="6" height="14" rx="2" fill="url(#bn-tier)" opacity=".8"/><text x="44" y="214" fill="#a1a1aa">10,001 – 100,000 × ₹20 / 1k</text><text x="400" y="214" text-anchor="end" fill="#d4d4d8">₹1,800.00</text>
      <rect x="28" y="224" width="6" height="14" rx="2" fill="url(#bn-tier)"/><text x="44" y="236" fill="#a1a1aa">100,001+ · emails · base fee</text><text x="400" y="236" text-anchor="end" fill="#d4d4d8">₹1,265.00</text>
    </g>
    <path d="M28 254 H400" stroke="#ffffff" stroke-opacity=".1"/>
    <text x="28" y="288" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.4" fill="#71717a">TOTAL DUE</text>
    <text x="400" y="290" text-anchor="end" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="800" letter-spacing="-.5" fill="#22c55e">₹3,065.00</text>
  </g>
</svg>
